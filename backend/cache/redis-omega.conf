# P22Ω_REDIS_HOIST · 2026-05-13 · COMMANDANT STEEVE-MAX
# Configuration Redis locale pour cache cross-pod + survival
bind 127.0.0.1 -::1
protected-mode yes
port 6379
unixsocket /tmp/redis.sock
unixsocketperm 700
timeout 0
tcp-keepalive 60
daemonize no
loglevel notice
logfile ""
databases 16
# Persistence légère (snapshot toutes les 5 min si > 100 changements)
save 300 100
save 600 10
stop-writes-on-bgsave-error no
rdbcompression yes
rdbchecksum yes
dbfilename redis-omega.rdb
dir /app/backend/cache
# Limites mémoire (LRU eviction si saturé — protège pod)
maxmemory 512mb
maxmemory-policy allkeys-lru
# Pas de réplication, pas de cluster
appendonly no
# Performance
activerehashing yes
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
