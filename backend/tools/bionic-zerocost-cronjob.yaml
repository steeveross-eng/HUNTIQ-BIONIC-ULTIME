# ════════════════════════════════════════════════════════════════════════════
# bionic-zerocost-cronjob.yaml — CronJob k8s ZEROCOST Canada parallélisé
# ════════════════════════════════════════════════════════════════════════════
# P22ΩΩ_PHASE3_WEATHERCACHE_BETA2_B_E_EXEC_Ω · 2026-02-19 · STEEVE-MAX
# COMMANDANT STEEVE-MAX · BCE-4X ULTIME ABSOLU
#
# Pré-warm P1 IFAP/ZEC/RF QC+Maritimes avec 256 workers parallèles k8s.
# Grille : canada_h3_grid_r6_qc_maritimes_weighted.json (68 054 cellules, P1=7 077).
# Couverture cible : 509 544 tuiles P1 (priorité 1 hotspots).
# Durée estimée : ~1.9 jours avec 256 workers (84s/tuile bio-positive QC).
#
# DÉPLOIEMENT (procédure complète pour cluster k8s cible) :
#   1. Créer les secrets :
#      kubectl create secret generic cf-r2-creds \
#        --from-literal=CF_API_TOKEN='cfut_...' \
#        --from-literal=CF_ACCOUNT_ID='91a64640f553556f2674b8613d909aad' \
#        --from-literal=R2_ACCESS_KEY_ID='<dashboard>' \
#        --from-literal=R2_SECRET_ACCESS_KEY='<dashboard>' \
#        --from-literal=OWM_API_KEY='444e2f791375898ce2db3a82b89f4a08'
#   2. kubectl create configmap canada-h3-grid \
#        --from-file=canada_h3_grid_r6_qc_maritimes_weighted.json
#   3. kubectl apply -f bionic-zerocost-cronjob.yaml
#   4. Suivi : kubectl logs -l app=bionic-zerocost,tier=precompute-worker --tail=100
#
# DÉCLENCHEMENT ONE-SHOT (pré-warm initial P1) :
#   kubectl create job --from=cronjob/bionic-zerocost-precompute-parallel \
#     prewarm-p1-$(date +%Y%m%d-%H%M)
# ════════════════════════════════════════════════════════════════════════════

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bionic-zerocost-grid-gen
  labels:
    app: bionic-zerocost
    role: grid-generator
spec:
  schedule: "0 7 * * 0"  # Hebdo dimanche 2h EST · génère la grille
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: grid-gen
              image: bionic-backend:latest
              command:
                - "python3"
                - "tools/zerocost_canada_h3_grid_generator.py"
                - "--resolution"
                - "4"
              volumeMounts:
                - name: zerocost-grid
                  mountPath: /app/backend/cache/zerocost_v1
          volumes:
            - name: zerocost-grid
              persistentVolumeClaim:
                claimName: bionic-zerocost-grid-pvc
---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: bionic-zerocost-precompute-parallel
  labels:
    app: bionic-zerocost
    role: precompute
    doctrine: p22omega-zerocost-omega
spec:
  schedule: "0 8 * * *"  # Daily 3h EST = 8h UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 7200
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # 🚀 PARALLÉLISATION : 256 workers indépendants (β2-Β+β2-Ε P1 pré-warm)
      # P22ΩΩ_PHASE3_WEATHERCACHE_BETA2_B_E_EXEC_Ω · STEEVE-MAX
      parallelism: 256
      completions: 256
      completionMode: Indexed  # WORKER_INDEX = JOB_COMPLETION_INDEX env
      backoffLimit: 2
      activeDeadlineSeconds: 259200  # 72h max (pré-warm one-shot)
      template:
        metadata:
          labels:
            app: bionic-zerocost
            tier: precompute-worker
        spec:
          restartPolicy: OnFailure
          containers:
            - name: zerocost-worker
              image: bionic-backend:latest
              imagePullPolicy: Always
              resources:
                requests:
                  memory: "1.5Gi"
                  cpu: "750m"
                limits:
                  memory: "3Gi"
                  cpu: "2000m"
              env:
                - name: MONGO_URL
                  valueFrom:
                    secretKeyRef: { name: mongo-creds, key: url }
                - name: DB_NAME
                  value: "huntiq_v6"
                - name: WORKER_INDEX
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
                - name: WORKER_COUNT
                  value: "256"
                - name: WORKER_RESOLUTION
                  value: "6"
                - name: GRID_FILE_PATH
                  value: "/app/backend/cache/zerocost_v1/canada_h3_grid_r6_qc_maritimes_weighted.json"
                - name: CF_API_TOKEN
                  valueFrom:
                    secretKeyRef: { name: cf-r2-creds, key: CF_API_TOKEN }
                - name: CF_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef: { name: cf-r2-creds, key: CF_ACCOUNT_ID }
                - name: CF_R2_BUCKET
                  value: "bionic-zerocost-omega"
                - name: OWM_API_KEY
                  valueFrom:
                    secretKeyRef: { name: cf-r2-creds, key: OWM_API_KEY }
                - name: PYTHONUNBUFFERED
                  value: "1"
              command:
                - "/bin/bash"
                - "-c"
                - |
                  set -e
                  cd /app/backend
                  echo "═══ ZEROCOST WORKER $WORKER_INDEX / $WORKER_COUNT ═══"
                  python3 tools/zerocost_worker_precompute.py
                  echo "✅ Worker $WORKER_INDEX terminé"
              volumeMounts:
                - name: zerocost-grid
                  mountPath: /app/backend/cache/zerocost_v1
                  readOnly: true
          volumes:
            - name: zerocost-grid
              persistentVolumeClaim:
                claimName: bionic-zerocost-grid-pvc

---
# Volume persistant partagé pour la grille H3
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bionic-zerocost-grid-pvc
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 1Gi

---
# Alerting Prometheus
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bionic-zerocost-alerts
  labels:
    app: bionic-zerocost
spec:
  groups:
    - name: bionic-zerocost-omega
      interval: 5m
      rules:
        - alert: ZerocostCronJobFailed
          expr: kube_job_status_failed{job_name=~"bionic-zerocost-.*"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "ZEROCOST CronJob a échoué"
        - alert: ZerocostTilesStale
          expr: time() - kube_cronjob_status_last_successful_time{cronjob="bionic-zerocost-precompute-parallel"} > 172800
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Tuiles ZEROCOST obsolètes (>48h)"
        - alert: ZerocostWorkerStarvation
          expr: |
            sum(rate(http_server_requests_seconds_count{job="bionic-backend",uri=~"/api/v20/territoire/bundle"}[5m]))
            > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Trop de requêtes V20 (cache CDN dégradé ?)"
